name: AnyTV
options:
  bundleIdPrefix: com.samflix
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  AnyTV:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../core
        excludes:
          - "anytv_cli.c"
          - "anytv_tls_stub.c"
      - path: Assets
        buildPhase: resources
      - path: Resources/scrcpy-server.jar
        buildPhase: resources
      - path: Resources/icons
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.samflix.anytv
        PRODUCT_NAME: AnyTV
        SWIFT_OBJC_BRIDGING_HEADER: Sources/AnyTV-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../core"
          - "$(SRCROOT)/Sources"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "X_NO_MAIN=1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_BITCODE: "NO"
        SWIFT_STRICT_CONCURRENCY: minimal
